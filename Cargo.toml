[package]
name = "senec-v3-workspace"
version = "1.1.16"
publish = false

[lints]
workspace = true

[workspace]
members = [
    "crates/senec-core",
    "crates/senec-discovery",
    "crates/senec-export",
    "apps/senec-collect",
    "apps/senec-discover",
]
default-members = ["apps/senec-collect"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["timsc"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Both are already in `pedantic`. Named again so the next reader can see they are deliberate.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
too_long_first_doc_paragraph = "warn"
doc_link_with_quotes = "warn"
doc_broken_link = "warn"
doc_include_without_cfg = "warn"

[workspace.lints.rustdoc]
# Denied rather than warned: a broken link renders as its literal source text, so it is invisible
# to the person reading the page and visible only to the person who no longer needs it.
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
prometheus = "0.14"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
