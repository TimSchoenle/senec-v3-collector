# Codecov configuration. Codecov reads this file from the commit it is processing, so a change
# here takes effect on the pull request that makes it.
#
# Everything above `component_management` is the baseline every repository in the estate carries
# unchanged; the components below are this workspace's own. Both statuses fail when their target
# is missed, so `codecov/patch` can be a required check.

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
    # One coverage upload per commit, from the `coverage` job in build.yaml. Test results are a
    # separate report type and do not count towards this.
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: '60...90'
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
        informational: false
    patch:
      default:
        target: 80%
        # A pull request that changes no measured line, such as a lockfile update, passes rather
        # than reporting 0% of nothing.
        if_not_found: success
        informational: false

comment:
  layout: 'condensed_header, diff, flags, components, condensed_files, condensed_footer'
  behavior: default
  require_changes: 'coverage_drop OR uncovered_patch'

github_checks:
  annotations: false

flag_management:
  default_rules:
    carryforward: true

ignore:
  - '**/fuzz/**'
  - 'xtask/**'
  - '**/benches/**'
  - '**/examples/**'
  - '**/generated/**'

# One component per workspace member, so a pull request's comment shows which crate its coverage
# moved in. The root package is left out: its `src/lib.rs` holds no code.
component_management:
  individual_components:
    - component_id: core
      name: senec-core
      paths: ['crates/senec-core/**']
    - component_id: discovery
      name: senec-discovery
      paths: ['crates/senec-discovery/**']
    - component_id: export
      name: senec-export
      paths: ['crates/senec-export/**']
    - component_id: collect
      name: senec-v3-collector
      paths: ['apps/senec-collect/**']
    - component_id: discover
      name: senec-v3-discover
      paths: ['apps/senec-discover/**']
