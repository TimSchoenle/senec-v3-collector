name: Build

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Read by the structure-test step in `docker-build-test`. Declared here with its `renovate:`
  # comment because that is what makes it visible to Renovate (`customManagers:githubActionsVersions`
  # in renovate.json); without one, a pin is never updated. Fetched from the GitHub release, as
  # TankoVault does, and checked against the release's checksums before it runs.
  # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
  CONTAINER_STRUCTURE_TEST_VERSION: 1.22.1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@88e964d440835fd99f7e9d17b4ba1b48544303ba # tag=actions-rust-cargo-check-v1.1.7

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2

  # Kept apart from `test`, so a Codecov outage fails this job alone. The upload authenticates
  # with this job's OIDC token, so the job needs no environment and no secret.
  # `.github/codecov.yml` decides what the Codecov statuses check.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The arguments `test` runs with, which are the rust/test action's defaults.
      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@81e4009704e0963651bbd8275e31244c1d1e220d # tag=actions-rust-coverage-codecov-v2.0.3
        with:
          test_arguments: '--all-features --workspace'
          flags: rust

  # Formatting is split in two. `cargo fmt` honours the pull request's rust-toolchain.toml and
  # rustfmt.toml, so `fmt` runs pull request code and holds no secret, no environment and no write
  # permission; it only uploads what it changed as a patch artifact. `fmt-commit` holds the App token
  # and runs no repository code: it checks out the head for git's objects only, and commit-patch
  # refuses any path outside `allowed_paths`.
  #
  # Pull requests only: a push to main is never formatted and committed to directly.
  fmt:
    name: Auto Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    outputs:
      changes_detected: ${{ steps.format.outputs.changes_detected }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The pull request head, not the merge commit: the patch is committed to the branch, so it has
      # to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto Format
        id: format
        uses: TimSchoenle/actions/actions/rust/auto-format@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-rust-auto-format-v2.0.0
        with:
          artifact_name: rust-auto-format

  fmt-commit:
    name: Commit Format
    needs: fmt
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' &&
      needs.fmt.outputs.changes_detected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Where ACTIONS_MAINTENANCE_APP_ID and ACTIONS_MAINTENANCE_PRIVATE_KEY live. Only this job gets
    # the environment, so the job that runs `cargo fmt` never sees the key.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    # Shared with docs.yml rather than with the rest of this workflow: both jobs commit to the
    # pull request branch through the API, which rejects a commit whose parent has moved. Racing
    # them would fail one of the two for a reason its log does not explain, so they queue. Only
    # this half takes the queue: the format job above writes nothing.
    concurrency:
      group: branch-writes-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read # Required to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # Scoped to the commit; without a `permission-*` input the token would inherit the whole
      # installation.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # Required to commit the formatted files

      # The artifact name is a literal on purpose: the `fmt` job's outputs come from pull request
      # code. `cargo fmt` only rewrites .rs files, so nothing else may be committed.
      - name: Commit Patch
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: rust-auto-format
          allowed_paths: '**/*.rs'
          commit_message: 'style: auto-format rust code'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The shared action only annotates findings; `-D warnings` is what fails the job on them.
      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-clippy-v1.1.13
        with:
          clippy_arguments: '--workspace --all-targets --all-features -- -D warnings'

  doc:
    name: Doc
    runs-on: ubuntu-latest
    env:
      # The rustdoc lints in [workspace.lints.rustdoc] run under rustdoc and nowhere else, so
      # neither cargo check nor clippy can fail a broken intra-doc link. This job is the only
      # place it goes red.
      RUSTDOCFLAGS: '-D warnings'
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The same pinned toolchain the shared cargo-check, test and clippy actions install, so the
      # documentation is built by the rustc the rest of the workflow already agreed on.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # No crate here declares a feature, so one pass renders every page there is.
      - name: Build the documentation
        run: cargo doc --workspace --all-features --no-deps

      - name: Run the doctests
        run: cargo test --doc --workspace --all-features

  docker-build-test:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    # doc is here so the documentation lints block a merge. A job in no needs: list is advisory,
    # and an advisory job goes red on main and stays there.
    needs: [ check, doc ]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
      pull-requests: write # Required to comment on PRs with image size and scan results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Every build reads the layer cache; only a push to `main` writes it. A pull request's
      # export is stored under the pull request's ref, which `main` never reads, but it counts
      # against the repository's 10 GB Actions cache all the same, and GitHub makes room by
      # evicting the least recently used entries, `main`'s among them.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: image:test
          build-args: |
            DATA_INPUT_DIRECTORY=data-test
            version=test
            release=test
            vendor=Tim Schönle
            VERSION=test
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # Both flags exit zero without touching the network, so the binary failing to start, or
      # starting as something else, fails the step instead of being swallowed by `|| true`.
      - name: Test Docker image runs
        run: |
          set -euo pipefail
          version="$(docker run --rm image:test --version)"
          printf '%s\n' "${version}"
          printf '%s' "${version}" | grep -q '^senec-v3-collector '
          help="$(docker run --rm image:test --help)"
          printf '%s\n' "${help}"
          printf '%s' "${help}" | grep -q 'Usage: senec-v3-collector'

      # A pinned release binary rather than the `:latest` image it replaces, which handed the
      # Docker socket to whatever that tag pointed at on the day.
      - name: Install container-structure-test
        run: |
          set -euo pipefail
          base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CONTAINER_STRUCTURE_TEST_VERSION}"
          asset="container-structure-test-linux-amd64"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "${base}/${asset}" -O "${base}/checksums.txt"
          grep "  ${asset}$" checksums.txt | sha256sum -c -
          chmod +x "$asset"
          sudo mv "$asset" /usr/local/bin/container-structure-test

      - name: Run structure tests
        run: container-structure-test test --image image:test --config cst.yaml

      # Size, Trivy scan, SARIF upload and the pull request comment in one step. The comment keeps
      # its docker-image-size identifier, so open pull requests have their existing comment updated
      # rather than a second one added. No platform is passed because this is the only image the
      # workflow builds, and a platform would move the SARIF under a new category and orphan every
      # alert code scanning already holds for it.
      - name: Check Docker image
        uses: TimSchoenle/actions/actions/docker/image-check@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-docker-image-check-v1.1.7
        with:
          image: image:test

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
