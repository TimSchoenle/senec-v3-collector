name: Build

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Read by the structure-test step in `docker-build-test`. Declared here with its `renovate:`
  # comment because that is what makes it visible to Renovate (`customManagers:githubActionsVersions`
  # in renovate.json); without one, a pin is never updated. Fetched from the GitHub release, as
  # TankoVault does, and checked against the release's checksums before it runs.
  # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
  CONTAINER_STRUCTURE_TEST_VERSION: 1.22.1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@88e964d440835fd99f7e9d17b4ba1b48544303ba # tag=actions-rust-cargo-check-v1.1.7

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2

  # Kept apart from `test`, so a Codecov outage fails this job alone. The upload authenticates
  # with this job's OIDC token, so the job needs no environment and no secret.
  # `.github/codecov.yml` decides what the Codecov statuses check.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # The arguments `test` runs with, which are the rust/test action's defaults.
      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@e4229b81c3c3c880b9561dc4d53bd87ccf49eaf3 # tag=actions-rust-coverage-codecov-v2.0.5
        with:
          test_arguments: '--all-features --workspace'
          flags: rust

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # The shared action only annotates findings; `-D warnings` is what fails the job on them.
      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-clippy-v1.1.13
        with:
          clippy_arguments: '--workspace --all-targets --all-features -- -D warnings'

  doc:
    name: Doc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The rustdoc lints in [workspace.lints.rustdoc] run under rustdoc and nowhere else, so
      # neither cargo check nor clippy can fail a broken intra-doc link. This job is the only
      # place it goes red.
      RUSTDOCFLAGS: '-D warnings'
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The same pinned toolchain the shared cargo-check, test and clippy actions install, so the
      # documentation is built by the rustc the rest of the workflow already agreed on.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      # No crate here declares a feature, so one pass renders every page there is.
      - name: Build the documentation
        run: cargo doc --workspace --all-features --no-deps

      - name: Run the doctests
        run: cargo test --doc --workspace --all-features

  docker-build-test:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # doc is here so the documentation lints block a merge. A job in no needs: list is advisory,
    # and an advisory job goes red on main and stays there.
    needs: [ check, doc ]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
      pull-requests: write # Required to comment on PRs with image size and scan results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Every build reads the layer cache; only a push to `main` writes it. A pull request's
      # export is stored under the pull request's ref, which `main` never reads, but it counts
      # against the repository's 10 GB Actions cache all the same, and GitHub makes room by
      # evicting the least recently used entries, `main`'s among them.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: image:test
          build-args: |
            DATA_INPUT_DIRECTORY=data-test
            version=test
            release=test
            vendor=Tim Schönle
            VERSION=test
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # Both flags exit zero without touching the network, so the binary failing to start, or
      # starting as something else, fails the step instead of being swallowed by `|| true`.
      - name: Test Docker image runs
        run: |
          set -euo pipefail
          version="$(docker run --rm image:test --version)"
          printf '%s\n' "${version}"
          printf '%s' "${version}" | grep -q '^senec-v3-collector '
          help="$(docker run --rm image:test --help)"
          printf '%s\n' "${help}"
          printf '%s' "${help}" | grep -q 'Usage: senec-v3-collector'

      # A pinned release binary rather than the `:latest` image it replaces, which handed the
      # Docker socket to whatever that tag pointed at on the day.
      - name: Install container-structure-test
        run: |
          set -euo pipefail
          base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CONTAINER_STRUCTURE_TEST_VERSION}"
          asset="container-structure-test-linux-amd64"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "${base}/${asset}" -O "${base}/checksums.txt"
          grep "  ${asset}$" checksums.txt | sha256sum -c -
          chmod +x "$asset"
          sudo mv "$asset" /usr/local/bin/container-structure-test

      - name: Run structure tests
        run: container-structure-test test --image image:test --config cst.yaml

      # Size, Trivy scan, SARIF upload and the pull request comment in one step. The comment keeps
      # its docker-image-size identifier, so open pull requests have their existing comment updated
      # rather than a second one added. No platform is passed because this is the only image the
      # workflow builds, and a platform would move the SARIF under a new category and orphan every
      # alert code scanning already holds for it.
      - name: Check Docker image
        uses: TimSchoenle/actions/actions/docker/image-check@e2799424abd778c41e7f6d1547fd402386ef398e # tag=actions-docker-image-check-v1.1.10
        with:
          image: image:test

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
