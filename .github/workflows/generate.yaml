name: Generate

# Every file a tool writes rather than a person. Each generator job runs on the pull request's head
# and uploads a patch; the Generated Files job is a required check and fails while a patch is not
# committed yet or a generator failed.
# generate-commit.yaml, a workflow_run workflow the pull request cannot edit, commits the merged
# patch to the branch, and the run on that commit decides.
#
# Both generators run the pull request's code, so they hold no secret and no write permission and
# hand on only a patch. The reverse gates stay in build.yaml and the docs workflow, which run on
# every event and therefore also cover the default branch and forks.
#
# No `paths` filter: the Generated Files check has to report on every pull request to be required.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  # `cargo fmt` honours the pull request's own `rust-toolchain.toml` and `rustfmt.toml`, so this
  # job runs code the pull request chose: it holds no secret and hands on only a patch.
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout the code
    outputs:
      has_changes: ${{ steps.format.outputs.changes_detected }}
      artifact_name: ${{ steps.format.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The pull request head, not the merge commit: the patch is committed to the branch, so it has
      # to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto Format
        id: format
        uses: TimSchoenle/actions/actions/rust/auto-format@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-rust-auto-format-v2.0.3
        with:
          artifact_name: rust-auto-format

  render:
    name: Render
    # A fork's branch is not in this repository, so there is nothing to commit to. The verify job
    # below picks those pull requests up instead.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds no secret: it reads the pull request's template and hands on only a patch, which
    # generate-commit.yaml (a workflow_run workflow the pull request cannot edit)
    # commits.
    permissions:
      contents: read # to fetch code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      artifact_name: ${{ steps.patch.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The head of the pull request, not the merge commit: the render has to read the template
      # the pull request proposes, and the patch is committed to the branch, so it has to be
      # computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Everything the template interpolates, read off the files in the checkout: the repository
      # coordinates, the release from Cargo.toml, and the table of documents walked out of docs/.
      # There is no `extra` here because this repository has no generator of its own.
      #
      # `branch` is the repository's default branch and not `github.ref_name`, which on a pull
      # request is `<number>/merge`. Rendering that into the badge URLs would make this job and the
      # verify job below disagree by construction, and every merge would then fail the gate for a
      # reason that is not in its diff.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-readme-variables-v2.1.4
        with:
          branch: ${{ github.event.repository.default_branch }}

      - name: Render the README
        uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@b37134ffa35b3ce98437447e3b4c76933eb65c04 # tag=actions-common-create-patch-v1.1.2
        with:
          artifact_name: readme-render
          paths: README.md

  # The required check. It needs every generator above and runs whatever their result, so it
  # reports on every pull request.
  verdict:
    name: Generated Files
    needs: [ fmt, render ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the commit the merged patch is made from
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Generated Files Verdict
        uses: TimSchoenle/actions/actions/common/generated-files-verdict@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-generated-files-verdict-v1.2.3
        with:
          needs: ${{ toJSON(needs) }}
